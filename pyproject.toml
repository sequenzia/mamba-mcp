[project]
name = "mamba-mcp"
version = "0.1.0"
description = "Mamba MCP - A collection of MCP tools and servers"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

# No dependencies at root - this is a virtual workspace

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mamba-mcp-core = { workspace = true }
mamba-mcp-client = { workspace = true }
mamba-mcp-pg = { workspace = true }
mamba-mcp-fs = { workspace = true }
mamba-mcp-hana = { workspace = true }
mamba-mcp-gitlab = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "respx>=0.22.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
warn_unused_ignores = false
exclude = [
    "packages/.*/tests/",
    "packages/.*/examples/",
]

[[tool.mypy.overrides]]
module = [
    "mcp.*",
    "fastmcp.*",
    "typer.*",
    "dotenv.*",
    "rich.*",
    "textual.*",
    "hdbcli.*",
    "fsspec.*",
    "s3fs.*",
    "pyperclip.*",
    "asyncpg.*",
    "botocore.*",
    "magic",
    "respx.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "mamba_mcp_hana.tools.*",
    "mamba_mcp_pg.tools.*",
    "mamba_mcp_fs.tools.*",
    "mamba_mcp_gitlab.tools.*",
    "mamba_mcp_client.cli",
    "mamba_mcp_client.tui.*",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "mamba_mcp_fs.backends.local",
    "mamba_mcp_fs.backends.s3",
    "mamba_mcp_hana.database.*",
    "mamba_mcp_client.client",
]
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "mamba_mcp_client.tui.*",
]
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
