[project]
name = "mamba-mcp-client"
dynamic = ["version"]
description = "A Python-based MCP Client for testing and debugging MCP Servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sequenzia" }]
keywords = ["mcp", "model-context-protocol", "testing", "debugging", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "textual>=0.50.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "typer>=0.12.0",
    "pyperclip>=1.9.0",
]

[project.scripts]
mamba-mcp-client = "mamba_mcp_client.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."
raw-options.version_scheme = "python-simplified-semver"
raw-options.local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/mamba_mcp_client/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mamba_mcp_client"]

