[project]
name = "mamba-mcp-hana"
dynamic = ["version"]
description = "SAP HANA MCP Server with layered schema discovery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sequenzia" }]
keywords = ["mcp", "sap-hana", "hana", "llm", "database", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mamba-mcp-core",
    "hdbcli",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.12.0",
]

[project.scripts]
mamba-mcp-hana = "mamba_mcp_hana.__main__:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."
raw-options.version_scheme = "python-simplified-semver"
raw-options.local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/mamba_mcp_hana/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mamba_mcp_hana"]
