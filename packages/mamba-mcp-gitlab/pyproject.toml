[project]
name = "mamba-mcp-gitlab"
dynamic = ["version"]
description = "GitLab MCP Server for merge requests, issues, pipelines, and search"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sequenzia" }]
keywords = ["mcp", "gitlab", "llm", "ai", "merge-requests", "pipelines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mamba-mcp-core",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.12.0",
]

[project.scripts]
mamba-mcp-gitlab = "mamba_mcp_gitlab.__main__:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."
raw-options.version_scheme = "python-simplified-semver"
raw-options.local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/mamba_mcp_gitlab/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mamba_mcp_gitlab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
